name: OpenCode Mobile Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/test-connection-saved-password

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  build:
    name: Build Android debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "Android SDK path tidak ditemukan"
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt/3"
            rm -rf "$SDK/ndk/27.1.12297006"

            if yes | sdkmanager --licenses >/dev/null 2>&1 || true; then
              :
            fi

            if sdkmanager --install "ndk;27.1.12297006" --verbose; then
              if [ -f "$SDK/ndk/27.1.12297006/source.properties" ]; then
                echo "NDK terpasang dan source.properties ditemukan."
                exit 0
              fi
            fi

            echo "Instalasi NDK gagal pada percobaan $attempt."
            sleep 5
          done

          echo "NDK gagal dipasang setelah 3 percobaan."
          exit 1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-v0.4.15-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
